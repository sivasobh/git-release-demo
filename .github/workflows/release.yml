name: Custom Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      release_branch:
        description: 'Create from release branch (leave empty to auto-detect or use develop)'
        required: false
        default: ''

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine current version and calculate next version
        id: version
        run: |
          # Get the latest tag matching v*.*.* pattern
          CURRENT_VERSION=$(git describe --tags --match 'v*.*.*' --abbrev=0 2>/dev/null || echo "v0.0.0")
          
          # Remove 'v' prefix for processing
          VERSION_NUM=${CURRENT_VERSION#v}
          
          # Parse version components
          MAJOR=$(echo $VERSION_NUM | cut -d. -f1)
          MINOR=$(echo $VERSION_NUM | cut -d. -f2)
          PATCH=$(echo $VERSION_NUM | cut -d. -f3)
          
          # Calculate new version based on input
          case "${{ github.event.inputs.version_type }}" in
            major)
              NEW_MAJOR=$((MAJOR + 1))
              NEW_MINOR=0
              NEW_PATCH=0
              ;;
            minor)
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$((MINOR + 1))
              NEW_PATCH=0
              ;;
            patch)
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$MINOR
              NEW_PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="v${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"
          
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "✓ Current version: $CURRENT_VERSION"
          echo "✓ New version: $NEW_VERSION"

      - name: Create release branch
        run: |
          NEW_VERSION=${{ steps.version.outputs.new_version }}
          RELEASE_BRANCH="release/${NEW_VERSION}"
          
          # Derive base branch: use input if provided, otherwise use develop or main
          BASE_BRANCH="${{ github.event.inputs.release_branch }}"
          if [ -z "$BASE_BRANCH" ]; then
            # Try develop first, fall back to main
            if git rev-parse --verify origin/develop > /dev/null 2>&1; then
              BASE_BRANCH="develop"
            else
              BASE_BRANCH="main"
            fi
          fi
          
          echo "Creating release branch from $BASE_BRANCH"
          git checkout -b "$RELEASE_BRANCH" "origin/$BASE_BRANCH"
          
          echo "release_branch=$RELEASE_BRANCH" >> $GITHUB_ENV
          echo "base_branch=$BASE_BRANCH" >> $GITHUB_ENV

      - name: Update version in files (if version file exists)
        run: |
          NEW_VERSION=${{ steps.version.outputs.new_version }}
          VERSION_NUM=${NEW_VERSION#v}
          
          # Update common version files
          if [ -f "package.json" ]; then
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION_NUM}\"/" package.json
            git add package.json
          fi
          
          if [ -f "VERSION" ] || [ -f "version.txt" ]; then
            echo "$VERSION_NUM" > VERSION
            git add VERSION
          fi
          
          if [ -f "setup.py" ]; then
            sed -i "s/version=\"[^\"]*\"/version=\"${VERSION_NUM}\"/" setup.py
            git add setup.py
          fi
          
          if git diff --cached --quiet; then
            echo "No version files updated"
          else
            git commit -m "chore: bump version to $NEW_VERSION"
          fi

      - name: Push release branch
        run: |
          RELEASE_BRANCH=${{ env.release_branch }}
          git push origin "$RELEASE_BRANCH"
          echo "✓ Release branch pushed: $RELEASE_BRANCH"

      - name: Create and push tag
        run: |
          NEW_VERSION=${{ steps.version.outputs.new_version }}
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          git push origin "$NEW_VERSION"
          echo "✓ Tag created and pushed: $NEW_VERSION"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.new_version }}
          name: ${{ steps.version.outputs.new_version }}
          generateReleaseNotes: true
          makeLatest: true

      - name: Create Pull Request to main
        if: env.base_branch != 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Merge release ${{ steps.version.outputs.new_version }} to main`,
              head: `${{ env.release_branch }}`,
              base: 'main',
              body: `# Release ${{ steps.version.outputs.new_version }}\n\nAutomatic merge from release branch.\n\nChangelog will be auto-generated.`
            });
            console.log(`Created PR #${pr.number}`);

      - name: Create Pull Request back to develop
        if: env.base_branch == 'develop'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Merge release ${{ steps.version.outputs.new_version }} back to develop`,
              head: `${{ env.release_branch }}`,
              base: 'develop',
              body: `# Release ${{ steps.version.outputs.new_version }} - Back merge\n\nAutomatic merge back to develop branch.`
            });
            console.log(`Created PR #${pr.number}`);

      - name: Release Summary
        run: |
          echo "## Release Created Successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| New Version | ${{ steps.version.outputs.new_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Branch | ${{ env.release_branch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Base Branch | ${{ env.base_branch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.version.outputs.new_version }} |" >> $GITHUB_STEP_SUMMARY
