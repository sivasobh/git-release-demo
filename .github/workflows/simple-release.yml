name: Simple Release (No PRs)

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  create-simple-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine current version and calculate next version
        id: version
        run: |
          # Get the latest tag matching v*.*.* pattern
          CURRENT_VERSION=$(git describe --tags --match 'v*.*.*' --abbrev=0 2>/dev/null || echo "v0.0.0")

          # Remove 'v' prefix for processing
          VERSION_NUM=${CURRENT_VERSION#v}

          # Parse version components
          MAJOR=$(echo $VERSION_NUM | cut -d. -f1)
          MINOR=$(echo $VERSION_NUM | cut -d. -f2)
          PATCH=$(echo $VERSION_NUM | cut -d. -f3)

          # Calculate new version based on input
          case "${{ github.event.inputs.version_type }}" in
            major)
              NEW_MAJOR=$((MAJOR + 1))
              NEW_MINOR=0
              NEW_PATCH=0
              ;;
            minor)
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$((MINOR + 1))
              NEW_PATCH=0
              ;;
            patch)
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$MINOR
              NEW_PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="v${NEW_MAJOR}.${NEW_MINOR}.${NEW_PATCH}"

          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "✓ Current version: $CURRENT_VERSION"
          echo "✓ New version: $NEW_VERSION"

      - name: Create release branch
        run: |
          NEW_VERSION=${{ steps.version.outputs.new_version }}
          RELEASE_BRANCH="release/${NEW_VERSION}"

          # Use develop as base branch since it's default
          BASE_BRANCH="develop"

          echo "Creating release branch from $BASE_BRANCH"
          git checkout -b "$RELEASE_BRANCH" "origin/$BASE_BRANCH"

          echo "release_branch=$RELEASE_BRANCH" >> $GITHUB_ENV
          echo "base_branch=$BASE_BRANCH" >> $GITHUB_ENV

      - name: Update version in files (if version file exists)
        run: |
          NEW_VERSION=${{ steps.version.outputs.new_version }}
          VERSION_NUM=${NEW_VERSION#v}

          # Update common version files
          if [ -f "package.json" ]; then
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION_NUM}\"/" package.json
            git add package.json
          fi

          if [ -f "VERSION" ] || [ -f "version.txt" ]; then
            echo "$VERSION_NUM" > VERSION
            git add VERSION
          fi

          if [ -f "setup.py" ]; then
            sed -i "s/version=\"[^\"]*\"/version=\"${VERSION_NUM}\"/" setup.py
            git add setup.py
          fi

          if git diff --cached --quiet; then
            echo "No version files updated"
          else
            git commit -m "chore: bump version to $NEW_VERSION"
          fi

      - name: Push release branch
        run: |
          RELEASE_BRANCH=${{ env.release_branch }}
          git push origin "$RELEASE_BRANCH"
          echo "✓ Release branch pushed: $RELEASE_BRANCH"

      - name: Create and push tag
        run: |
          NEW_VERSION=${{ steps.version.outputs.new_version }}
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          git push origin "$NEW_VERSION"
          echo "✓ Tag created and pushed: $NEW_VERSION"

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.new_version }}
          name: ${{ steps.version.outputs.new_version }}
          generateReleaseNotes: true
          makeLatest: true

      - name: Release Summary
        run: |
          echo "## Release Created Successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| New Version | ${{ steps.version.outputs.new_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Branch | ${{ env.release_branch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Base Branch | ${{ env.base_branch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.version.outputs.new_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the release branch: ${{ env.release_branch }}" >> $GITHUB_STEP_SUMMARY
          echo "2. Manually create PR from ${{ env.release_branch }} → main" >> $GITHUB_STEP_SUMMARY
          echo "3. Manually create PR from ${{ env.release_branch }} → develop (if needed)" >> $GITHUB_STEP_SUMMARY